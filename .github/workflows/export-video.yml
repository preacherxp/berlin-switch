# Tests the scene, then records the full switch whenever it changes and commits the MP4 the demo links to.
name: Export video
on:
  push:
    branches: [main]
    paths: ['city-switch.js', 'berlin.js', 'index.html', 'tools/capture-switch.cjs', '.github/workflows/export-video.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: export-video
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/checkout@v6
        with:
          repository: preacherxp/city-switches
          path: .central
      - name: Test the scene and its composition
        run: |
          if [ -f test-scene.cjs ]; then node test-scene.cjs; fi
          # The composition check reads a city from the central layout, so stand this checkout in it.
          mkdir -p .central/repos && rm -rf .central/repos/berlin-switch
          ln -s "$PWD" .central/repos/berlin-switch
          node .central/tools/check-composition.cjs berlin
          rm -rf .central
      - name: Install browser and encoder
        run: |
          npm install --prefix "$RUNNER_TEMP/recording" playwright@1.56.1
          "$RUNNER_TEMP/recording/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Review and capture the full switch
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/http.log" 2>&1 &
          CAPTURE_ROOT=. CAPTURE_PATH=/ NODE_PATH="$RUNNER_TEMP/recording/node_modules" node tools/capture-switch.cjs berlin
          ffmpeg -y -framerate 60 -i capture/berlin/frames/%03d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart berlin-day-night-60fps.mp4
          ffprobe -v error -select_streams v -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of csv=p=0 berlin-day-night-60fps.mp4
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: berlin-review
          path: |
            capture/berlin/*.png
            capture/berlin/*.json
          retention-days: 7
      - name: Commit the video if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add berlin-day-night-60fps.mp4
          if git diff --cached --quiet; then echo "Video unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Export the day/night video for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "Pages build request failed; the push may already have triggered one"
